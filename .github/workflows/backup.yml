name: D1 backup

# 週 1 回、本番 D1 を wrangler d1 export で SQL に書き出し Actions アーティファクトに保存する(DECISIONS.md D-012 / D-015)。
# 保持 28 日 = 週次 4 世代。D1 の Time Travel(7 日)の補完。
on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloudflare setup (account ID / D1)
        uses: ./.github/actions/cloudflare-setup
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Export D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          pnpm exec wrangler d1 export ladder-dojo --remote --output "$RUNNER_TEMP/ladder-dojo-$STAMP.sql"
          gzip -9 "$RUNNER_TEMP/ladder-dojo-$STAMP.sql"
          ls -l "$RUNNER_TEMP"/ladder-dojo-*.sql.gz

      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/ladder-dojo-*.sql.gz
          retention-days: 28
          if-no-files-found: error
