<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- 描画前にテーマを決める。React が動いてから切り替えると、一瞬だけ白い画面が見える -->
    <script>
      (() => {
        var theme = "light";
        try {
          theme = localStorage.getItem("ladder-dojo:theme");
          if (theme !== "dark" && theme !== "light") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        } catch {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="PLC のラダー図を「読む」→「直す」→「書く」の順に身につける練習アプリ。"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS Safari は apple-touch-icon に SVG を受け付けない。PNG が要る -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ラダー道場" />
    <title>ラダー図トレーニング</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
